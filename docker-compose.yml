version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: routeforge
      POSTGRES_USER: routeforge
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routeforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  routeforge:
    build: .
    environment:
      - PORT=8080
      - DB_URL=postgresql://routeforge:password@postgres:5432/routeforge
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
